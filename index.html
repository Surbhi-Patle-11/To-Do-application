<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1 >To-DO-Application</h1>
    <div id="task-container">All TO-do</div> 
    <div class="task-input-conatainer">
        <input type="text" placeholder="Enter new Todo" id="todo-input">
        <button id="add-todo-btn" onclick="addtask()">Add Todo</button>
        
    </div>
    <script>
        const tasks =[
            
           
        ];

       function loadTask(){

        localStorage.setItem('alltask',JSON.stringify(tasks));
        const taskcontainer =document.getElementById("task-container");
        taskcontainer.innerHTML = '';

        for( i =0 ; i < tasks.length ; i++){
            taskcontainer.innerHTML +=`<div>${tasks[i]}</div>`;
        }

       }
       function addtask(){
        const taskinputElement =document.getElementById("todo-input");
        const task =taskinputElement.value;

        if(!task){
            alert("please Enter a Task")
        }

        tasks.push(task);
        loadTask();
        console.log(tasks);
        taskinputElement.value="";

       }
       function deleteTask(){

       }
    </script>

</body>
</html>
