<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main-box">
        <h1 ><div class="text">To-DO</div>-Application</h1>
    
    
       <div class="only-i-b"></div>
        
    <div class="task-input-conatainer">
        <input type="text" placeholder="Enter new Todo" id="todo-input">
        <button id="add-todo-btn" onclick="addtask()">Add Todo</button>
        
    </div>
    <div id="task-container" >All TO-do</div>
    </div>
    <script>
        const tasks =[
            
           
        ];

       function localfromLocalstorage(){
        const savedtask =JSON.parse(localStorage.getItem('alltask'));
        if(savedtask){
            tasks.push(...savedtask)
        }

loadTask();
       }

        localfromLocalstorage();

       function loadTask(){

        localStorage.setItem('alltask',JSON.stringify(tasks));
        const taskcontainer =document.getElementById("task-container");
        taskcontainer.innerHTML = '';

        for( i =0 ; i < tasks.length ; i++){
            taskcontainer.innerHTML +=`<div  class="task-item" class="text-1"><input type="checkbox" class="checkbox"  id="lo-${i}"><label for="lo-${i}" class="ox">${tasks[i]}</label><img src="./images/dlt-icon.png" height="25px" onclick="deletetask()"></div>`;
        }

       }
       function addtask(){
        const taskinputElement =document.getElementById("todo-input");
        const task =taskinputElement.value;

        if(!task){
            alert("please Enter a Task")
        }

        tasks.push(task);
        loadTask();
        console.log(tasks);
        taskinputElement.value="";

       }
        function deletetask(index) {

            tasks.splice(index,1);
            loadTask();



       }
    </script>

</body>
</html>
